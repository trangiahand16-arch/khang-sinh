<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 điều nhỏ giữ kháng sinh luôn hiệu quả</title>
<meta name="description" content="Lời nhắn từ đội ngũ Dược sĩ: 5 điều nhỏ giữ kháng sinh luôn hiệu quả.">
<meta property="og:title" content="5 điều nhỏ giữ kháng sinh luôn hiệu quả">
<meta property="og:image" content="khang-sinh.jpg">
<style>
  html,body{margin:0;padding:0;background:#eef5fb;}
  img{display:block;width:100%;max-width:1080px;height:auto;margin:0 auto;}
</style>

<!-- ============ CHỈ CẦN SỬA 1 DÒNG DƯỚI ĐÂY ============ -->
<script>
  var TEN_GOATCOUNTER = "khangsinh";   // Ví dụ: "duocsi-khangsinh"  (tên chị đặt khi đăng ký GoatCounter)
</script>
<!-- ===================================================== -->

<script>
  // Đếm lượt quét. Nếu link có ?src=... (ví dụ ?src=quay-thuoc) thì đếm riêng từng nơi dán QR.
  (function () {
    if (!TEN_GOATCOUNTER) return;
    var src = new URLSearchParams(location.search).get("src") || "chung";
    window.goatcounter = { path: function () { return "/quet/" + src; }, title: "Quét QR: " + src };
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter", "https://" + TEN_GOATCOUNTER + ".goatcounter.com/count");
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
  <img src="khang-sinh.jpg" alt="5 điều nhỏ giữ kháng sinh luôn hiệu quả: 1. Đúng bệnh, đúng thuốc. 2. Chỉ dùng khi có chỉ định của bác sĩ. 3. Uống đủ liều, đủ ngày. 4. Phòng bệnh hơn chữa bệnh. 5. Dùng kháng sinh trách nhiệm, bảo vệ tương lai.">
</body>
</html>
